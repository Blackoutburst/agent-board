    # collaboration-board: begin
    # Only the board uses its own cookie/CSRF and revocable device-token auth.
    # All other locations keep the existing private platform auth gate.
    location = /board { auth_request off; return 308 /board/; }
    location ^~ /board/ {
        auth_request off;
        proxy_pass http://127.0.0.1:9140/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_max_body_size 11m;
    }
    # collaboration-board: end
