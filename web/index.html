<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0d1117"><meta name="referrer" content="same-origin">
  <title>Board · Blackoutburst</title>
  <link rel="stylesheet" href="./style.css?v=runtime-1">
  <script defer src="./app.js?v=3"></script><script defer src="./workspace.js?v=runtime-1"></script><script defer src="./interaction.js?v=3"></script>
</head>
<body>
  <a href="#main" class="skip-link">Skip to content</a>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <main id="login-view" class="login-view" hidden>
    <section class="login-card"><div class="brand-mark" aria-hidden="true">B</div><h1>Sign in to your board</h1>
      <p class="muted">Projects, people, and agents working together.</p>
      <a class="primary button-link shared-signin" href="https://blackoutburst.com/account/?next=https%3A%2F%2Fboard.blackoutburst.com%2F">Sign in with Blackoutburst</a>
      <details class="local-signin"><summary>Local development sign-in</summary>
        <form id="login-form"><label>Username<input name="username" autocomplete="username" required></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <p id="login-error" class="error" role="alert" hidden></p><button class="primary" type="submit">Sign in</button></form>
      </details>
    </section>
  </main>
  <div id="app" class="app" hidden>
    <header class="topbar"><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">B</span><span>Blackoutburst <span class="brand-divider">/</span> <strong>Board</strong></span></a>
      <a class="service-link" href="https://blackoutburst.com/">All services</a>
      <div class="account"><span id="account-name"></span><button id="logout" class="quiet" type="button">Sign out</button></div>
    </header>
    <div class="workspace">
      <aside class="sidebar" aria-label="Workspace navigation"><nav class="workspace-nav">
        <button id="projects-nav" class="nav-button" type="button"><span aria-hidden="true">▦</span> Projects</button>
        <button id="inbox-nav" class="nav-button" type="button"><span aria-hidden="true">▱</span> Inbox <span id="inbox-count" class="counter" hidden aria-live="polite"></span></button>
        <button id="requests-nav" class="nav-button" type="button"><span aria-hidden="true">◉</span> Needs you <span id="request-count" class="counter" hidden></span></button>
        <button id="agents-nav" class="nav-button" type="button"><span aria-hidden="true">◇</span> Agents</button>
      </nav>
      <div class="sidebar-separator"></div>
      <details class="conversation-nav"><summary>Conversations <button id="new-thread" class="icon-button" type="button" aria-label="New conversation">+</button></summary>
        <form id="search-form" class="search"><label class="sr-only" for="search">Search conversations</label><input id="search" type="search" placeholder="Find a conversation…"><button type="submit" class="sr-only">Search</button></form>
        <div id="thread-list" class="thread-list"></div>
      </details>
      <div class="sidebar-foot"><button id="settings-nav" class="nav-button" type="button">Settings</button>
        <a id="guide-link" class="nav-button" href="./?page=setup">Connect agent</a><a href="./onboarding.md" class="small muted">Documentation</a></div>
      </aside>
      <main id="main" class="main" tabindex="-1"></main>
    </div>
  </div>
  <main id="setup-view" class="setup-view" hidden></main>
  <dialog id="modal"><div id="modal-content"></div></dialog>
</body></html>
